services:
  backend:
    build:
      context: ./a3/backend
      dockerfile: Dockerfile
    container_name: a3_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODE=local
      - JWT_SECRET=a3_super_secret_jwt_key_for_production_min32chars
      - DATABASE_URL=sqlite:///./data/a3_local.db
      - STORAGE_PATH=./data/uploads
      - ALLOWED_ORIGINS=["http://localhost:3000"]
    volumes:
      - a3_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./a3/frontend
      dockerfile: Dockerfile
    container_name: a3_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000

volumes:
  a3_data:
