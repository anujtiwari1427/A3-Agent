services:
  # FastAPI Backend Service (100% Free Tier)
  - type: web
    name: a3-backend
    runtime: python
    plan: free
    buildCommand: "cd a3/backend && pip install -r requirements.txt"
    startCommand: "cd a3/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODE
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./a3_local.db
